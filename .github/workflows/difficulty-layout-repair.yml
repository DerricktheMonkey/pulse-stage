name: Verify difficulty bar fit
on:
  push:
    branches: [fix/difficulty-bar-fit]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/difficulty-bar-fit
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply scoped layout correction
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile,mkdir} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          await mkdir('.repair-results',{recursive:true});
          const old='#difficulties{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}#difficulties button{min-width:0}';
          const next='/* Size difficulty columns to their full labels, including Impossible. */\n#difficulties{display:grid;grid-template-columns:repeat(5,minmax(max-content,1fr));gap:2px;padding:3px}\n#difficulties button{min-width:0;padding:8px 1px;white-space:nowrap;line-height:1.3}\n#difficulties button:focus-visible{outline-offset:-2px}';
          for(const prefix of ['', 'public/']){
           const css=await readFile(prefix+'style.css','utf8');assert.equal(css.split(old).length,2,'CSS anchor changed');await writeFile(prefix+'style.css',css.replace(old,next));
           const html=await readFile(prefix+'index.html','utf8');assert.equal(html.split('href="style.css?v=112"').length,2,'stylesheet cache key changed');await writeFile(prefix+'index.html',html.replace('href="style.css?v=112"','href="style.css?v=113"'));
          }
          NODE
      - name: Build and regression tests
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build
          npm test | tee .repair-results/difficulty-unit.txt
      - name: Prepare browser
        run: |
          npm install --no-save --package-lock=false playwright
          if ! command -v google-chrome && ! command -v chromium; then npx playwright install --with-deps chromium; fi
      - name: Check full application layout on both deployments
        id: browser
        continue-on-error: true
        run: |
          node scripts/difficulty-layout-browser.mjs
          STUDIO_ROOT=. node scripts/difficulty-layout-browser.mjs
      - name: Record candidate and results on repair branch
        if: always()
        env:
          UNIT: ${{ steps.unit.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          mkdir -p .repair-results
          node -e 'require("fs").writeFileSync(".repair-results/difficulty-summary.json",JSON.stringify({unit:process.env.UNIT,browser:process.env.BROWSER},null,2))'
          git config user.name 'Pulse Stage verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css public/style.css index.html public/index.html worker/index.js dist/server/index.js
          find .repair-results -name 'difficulty-*.json' -exec git add -f {} +
          if test -f .repair-results/difficulty-unit.txt; then git add -f .repair-results/difficulty-unit.txt; fi
          git diff --cached --quiet || git commit -m 'Apply content-sized difficulty bar and record browser verification'
          git push origin HEAD:fix/difficulty-bar-fit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: difficulty-layout-results
          path: .repair-results
      - name: Require passing checks
        env:
          UNIT: ${{ steps.unit.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: test "$UNIT" = success && test "$BROWSER" = success
