name: Inspect affected compressed background
on:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect-background.mjs'
      - '.github/workflows/background-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Ensure video probe tools
        run: |
          if ! command -v ffprobe; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Read public background and inspect opening frames
        id: inspect
        run: node scripts/inspect-background.mjs
      - name: '${{ steps.inspect.outputs.summary }}'
        run: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: background-diagnostic
          path: background-diagnostic.json
