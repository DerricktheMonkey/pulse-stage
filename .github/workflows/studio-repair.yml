name: Verify Beatmap Studio repair
on:
  push:
    branches: [fix/creator-generation-verified]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verification follow-up
        id: apply
        run: |
          mkdir -p .repair-results
          node scripts/studio-followup.mjs
      - name: Build and run all unit regressions
        id: tests
        continue-on-error: true
        run: |
          set +e
          npm run build > .repair-results/build.txt 2>&1
          build=$?
          npm test > .repair-results/unit.txt 2>&1
          unit=$?
          printf '{"buildExit":%s,"unitExit":%s}\n' "$build" "$unit" > .repair-results/summary.json
          cat .repair-results/build.txt
          tail -n 90 .repair-results/unit.txt
          test "$build" -eq 0 && test "$unit" -eq 0
      - name: Install browser test harness
        id: browser_setup
        continue-on-error: true
        run: |
          npm install --no-save --package-lock=false playwright
          if ! command -v google-chrome && ! command -v chromium; then npx playwright install --with-deps chromium; fi
      - name: Exercise real browser editing and playback on both deployments
        id: browser
        if: steps.browser_setup.outcome == 'success'
        continue-on-error: true
        run: |
          node scripts/studio-browser.mjs
          cp .repair-results/browser.json .repair-results/browser-public.json
          STUDIO_ROOT=. node scripts/studio-browser.mjs
          cp .repair-results/browser.json .repair-results/browser-root.json
      - name: Record tested source and diagnostics on repair branch only
        if: always() && steps.apply.outcome == 'success'
        env:
          GH_BRANCH: fix/creator-generation-verified
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const p='.repair-results/summary.json';let report={};try{report=JSON.parse(readFileSync(p,'utf8'));}catch{}
          report.browserOutcome=process.env.BROWSER_OUTCOME;writeFileSync(p,JSON.stringify(report,null,2));
          NODE
          git config user.name 'Pulse Stage verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public '*.js' '*.css' index.html tests scripts docs dist .repair-results/*.json .repair-results/*.txt
          git diff --cached --quiet || git commit -m 'Record Studio browser and generator regression results'
          git push origin HEAD:"$GH_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-verification
          path: .repair-results
      - name: Require every check to pass
        if: always()
        env:
          UNIT_RESULT: ${{ steps.tests.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
        run: test "$UNIT_RESULT" = success && test "$BROWSER_RESULT" = success
